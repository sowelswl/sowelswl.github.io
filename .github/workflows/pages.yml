name: Deploy personal site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        name: Deploy and wait for Pages
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL" |
              jq -r '.value'
          )"
          payload="$(
            jq -n \
              --argjson artifact_id "$ARTIFACT_ID" \
              --arg pages_build_version "$GITHUB_SHA" \
              --arg oidc_token "$oidc_token" \
              '{artifact_id: $artifact_id, pages_build_version: $pages_build_version, oidc_token: $oidc_token}'
          )"
          deployment="$(
            curl -fsSL -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "$payload"
          )"
          deployment_id="$(jq -r '.id' <<<"$deployment")"
          page_url="$(jq -r '.page_url' <<<"$deployment")"
          echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
          echo "Created Pages deployment $deployment_id"

          for attempt in $(seq 1 360); do
            status="$(
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments/$deployment_id" |
                jq -r '.status'
            )"

            case "$status" in
              succeed)
                echo "Pages deployment succeeded"
                exit 0
                ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "::error::Pages deployment ended with status $status"
                exit 1
                ;;
              *)
                echo "Pages deployment status: $status (check $attempt/360)"
                sleep 5
                ;;
            esac
          done

          echo "::error::Pages deployment did not finish within 30 minutes"
          exit 1
